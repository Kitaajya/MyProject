<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>StoleWebSite4 - 媒体资源爬虫</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .search-box {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3a7bd5;
        }
        input[type="text"]::placeholder {
            color: #666;
        }
        button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-box {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            display: none;
        }
        .page-info {
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .page-info h2 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 6px;
        }
        .page-info p {
            color: #999;
            font-size: 13px;
        }
        .stats {
            display: flex;
            gap: 20px;
            padding: 15px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .stat-item {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .stat-video { background: rgba(255,71,87,0.2); color: #ff4757; }
        .stat-audio { background: rgba(46,213,115,0.2); color: #2ed573; }
        .stat-image { background: rgba(255,165,2,0.2); color: #ffa502; }
        .stat-iframe { background: rgba(70,130,255,0.2); color: #4682ff; }

        .section {
            padding: 15px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .section:last-child { border-bottom: none; }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-video { background: #ff4757; }
        .dot-audio { background: #2ed573; }
        .dot-image { background: #ffa502; }
        .dot-iframe { background: #4682ff; }

        .media-list { list-style: none; }
        .media-list li {
            padding: 8px 12px;
            margin: 4px 0;
            background: rgba(0,0,0,0.25);
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .media-list li a {
            color: #7ec8e3;
            text-decoration: none;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .media-list li a:hover { text-decoration: underline; }
        .play-btn {
            padding: 3px 10px;
            background: rgba(255,71,87,0.25);
            border: 1px solid rgba(255,71,87,0.4);
            border-radius: 4px;
            color: #ff6b7a;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
        }
        .play-btn:hover { background: rgba(255,71,87,0.4); }
        .copy-btn {
            padding: 3px 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.2); }

        .player-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }
        .player-overlay video,
        .player-overlay audio {
            max-width: 90vw;
            max-height: 90vh;
        }
        .player-close {
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 10000;
            padding: 8px 20px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .player-close:hover { background: rgba(255,255,255,0.3); }

        .empty { color: #555; font-size: 13px; padding: 10px 0; }
        .error-msg { color: #ff4757; text-align: center; padding: 40px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>StoleWebSite4</h1>
        <p class="subtitle">输入网址，自动提取页面中所有媒体资源（视频/音频/图片/嵌入）</p>

        <div class="search-box">
            <div class="input-row">
                <input type="text" id="urlInput" placeholder="输入网址，例如 https://www.example.com" />
                <button id="crawlBtn" onclick="startCrawl()">开始爬取</button>
            </div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="page-info">
                <h2 id="pageTitle"></h2>
                <p id="pageDesc"></p>
            </div>
            <div class="stats" id="statsBar"></div>
            <div id="sections"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script>
        var currentHls = null;

        document.getElementById('urlInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') startCrawl();
        });

        function startCrawl() {
            var url = document.getElementById('urlInput').value.trim();
            if (!url) { alert('请输入网址'); return; }

            var btn = document.getElementById('crawlBtn');
            btn.disabled = true;
            btn.textContent = '爬取中...';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/crawl', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onreadystatechange = function() {
                btn.disabled = false;
                btn.textContent = '开始爬取';
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        renderResult(JSON.parse(xhr.responseText));
                    } else {
                        alert('请求失败: ' + xhr.status);
                    }
                }
            };
            xhr.send('url=' + encodeURIComponent(url));
        }

        function renderResult(data) {
            var box = document.getElementById('resultBox');
            box.style.display = 'block';

            document.getElementById('pageTitle').textContent = data.title || '无标题';
            document.getElementById('pageDesc').textContent = data.description || '无描述';

            var videos = data.videos || [];
            var audios = data.audios || [];
            var images = data.images || [];
            var iframes = data.iframes || [];

            var statsHtml = '';
            statsHtml += '<span class="stat-item stat-video">视频 ' + videos.length + '</span>';
            statsHtml += '<span class="stat-item stat-audio">音频 ' + audios.length + '</span>';
            statsHtml += '<span class="stat-item stat-image">图片 ' + images.length + '</span>';
            statsHtml += '<span class="stat-item stat-iframe">嵌入 ' + iframes.length + '</span>';
            document.getElementById('statsBar').innerHTML = statsHtml;

            var html = '';
            html += buildSection('视频资源', 'video', videos);
            html += buildSection('音频资源', 'audio', audios);
            html += buildSection('图片资源', 'image', images);
            html += buildSection('嵌入资源', 'iframe', iframes);
            document.getElementById('sections').innerHTML = html;

            box.scrollIntoView({ behavior: 'smooth' });
        }

        function buildSection(title, type, list) {
            var html = '<div class="section">';
            html += '<div class="section-title"><span class="dot dot-' + type + '"></span>' + title + '</div>';
            if (list.length === 0) {
                html += '<div class="empty">未发现此类资源</div>';
            } else {
                html += '<ul class="media-list">';
                for (var i = 0; i < list.length; i++) {
                    var url = list[i];
                    html += '<li>';
                    html += '<a href="' + url + '" target="_blank" title="' + url + '">' + url + '</a>';
                    if (type === 'video' || type === 'audio') {
                        html += '<button class="play-btn" onclick="openPlayer(\'' + type + '\', \'' + url.replace(/'/g, "\\'") + '\')">在线播放</button>';
                    }
                    html += '<button class="copy-btn" onclick="copyUrl(this, \'' + url.replace(/'/g, "\\'") + '\')">复制</button>';
                    html += '</li>';
                }
                html += '</ul>';
            }
            html += '</div>';
            return html;
        }

        function openPlayer(type, url) {
            var proxyUrl = '/api/proxy?url=' + encodeURIComponent(url);
            var overlay = document.createElement('div');
            overlay.className = 'player-overlay';
            overlay.onclick = function(e) {
                if (e.target === overlay) closePlayer();
            };

            var closeBtn = document.createElement('button');
            closeBtn.className = 'player-close';
            closeBtn.textContent = '关闭播放';
            closeBtn.onclick = closePlayer;

            if (type === 'video') {
                var video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.maxWidth = '90vw';
                video.style.maxHeight = '90vh';

                if (url.indexOf('.m3u8') !== -1 && typeof Hls !== 'undefined' && Hls.isSupported()) {
                    var hls = new Hls();
                    currentHls = hls;
                    hls.loadSource(proxyUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(function() {});
                    });
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            console.error('HLS fatal error:', data);
                            hls.destroy();
                            currentHls = null;
                        }
                    });
                } else {
                    video.src = proxyUrl;
                }

                overlay.appendChild(video);
            } else {
                var audio = document.createElement('audio');
                audio.controls = true;
                audio.autoplay = true;
                audio.src = proxyUrl;
                overlay.appendChild(audio);
            }

            document.body.appendChild(overlay);
            document.body.appendChild(closeBtn);
        }

        function closePlayer() {
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            var overlay = document.querySelector('.player-overlay');
            var closeBtn = document.querySelector('.player-close');
            if (overlay) {
                var media = overlay.querySelector('video') || overlay.querySelector('audio');
                if (media) { media.pause(); media.src = ''; }
                overlay.remove();
            }
            if (closeBtn) closeBtn.remove();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePlayer();
        });

        function copyUrl(btn, url) {
            navigator.clipboard.writeText(url).then(function() {
                btn.textContent = '已复制';
                setTimeout(function() { btn.textContent = '复制'; }, 1500);
            });
        }
    </script>
</body>
</html>
